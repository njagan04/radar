[project]
name = "radar"
version = "0.1.0"
description = "AI-powered pipeline failure investigation system"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<0.116",
    "openai>=2.45,<3",
    "pydantic-settings>=2.6,<3",
    "asyncpg>=0.30,<0.31",
    "sqlalchemy[asyncio]>=2.0,<3",
    "redis[asyncio]>=5.2,<6",
    "azure-mgmt-datafactory>=6.0,<7",
    "azure-identity>=1.19,<2",
    "httpx>=0.27,<0.28",
    "openai-agents>=0.18,<0.19",
    "tiktoken>=0.8,<0.9",
    "pyjwt>=2.13.0,<3",
    "pycryptodome>=3.23.0,<4",
    "sentence-transformers>=5.7.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "fakeredis>=2.26,<3",
    "aiosqlite>=0.20,<0.21",
    "ruff>=0.8,<1",
    "lefthook>=2.1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
